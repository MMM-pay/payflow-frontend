name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_PLAN_REGISTRY_ID: CABL5QWEQKMAIDXTQCHEJ2TAAPYUHSQDY73Z4LIK6BOBGYUYO7RG6HJA
          NEXT_PUBLIC_VAULT_ID: CBWDD6KVMLEH2D5IVPHZJW4TLLL2RVWGNJRN2US6INNBFTH35K2KYSF7
          NEXT_PUBLIC_SUBSCRIPTION_ID: CBKQVZGZJMY47JFRCOF2RFKEMTTYKUF4LI54AOB6EGDFODNZU7MSUW6K
          NEXT_PUBLIC_TOKEN_ID: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          NEXT_PUBLIC_API_URL: http://localhost:8080
