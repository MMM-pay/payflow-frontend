name: PR preview deploy

# Publishes the static site built by "PR preview build" and comments the
# preview URL on the pull request.
#
# This runs on `workflow_run`, which has write access even when the pull
# request comes from a fork — but it never checks out or executes the pull
# request's code. It only uploads the static files the build produced with
# the Netlify CLI, so no secret ever reaches anything a contributor controls.
#
# One-time setup (repository or organisation secrets):
#   NETLIFY_AUTH_TOKEN  a Netlify personal access token
#   NETLIFY_SITE_ID     the id of a Netlify site created for previews
# Without them the deploy step is skipped and says so in the job summary;
# the PR preview build check still proves the pull request builds.

on:
  workflow_run:
    workflows: [PR preview build]
    types: [completed]

permissions:
  contents: read
  # Download the artifact produced by the unprivileged "PR preview build" run.
  actions: read
  pull-requests: write

# One deploy per pull request branch; a newer push cancels the older deploy.
concurrency:
  group: preview-deploy-${{ github.event.workflow_run.head_repository.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // `workflow_run.pull_requests` is empty for pull requests from
            // forks, so the pull request is looked up by head branch instead.
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const number = pulls[0]?.number ?? 0;
            core.setOutput("number", String(number));

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            {
              echo "### PR preview"
              echo "NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not configured, so no preview was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! output=$(npx --yes netlify-cli@27.14.2 deploy \
            --dir=site \
            --no-build \
            --message "PR #$PR_NUMBER" \
            --json); then
            echo "::error::Netlify deploy failed"
            echo "$output"
            exit 1
          fi
          url=$(printf '%s' "$output" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);process.stdout.write(j.deploy_url||j.url||"")}catch{process.stdout.write("")}})')
          if [ -z "$url" ]; then
            echo "::error::Netlify deploy returned no URL: $output"
            exit 1
          fi
          {
            echo "deployed=true"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### PR preview"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL
        if: steps.deploy.outputs.deployed == 'true' && steps.pr.outputs.number != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- payflow-pr-preview -->";
            const url = "${{ steps.deploy.outputs.url }}";
            const body = [
              marker,
              "### PR preview",
              `${url} — static export of this pull request, running against testnet in contract-only mode.`,
            ].join("\n");
            const issue_number = Number("${{ steps.pr.outputs.number }}");
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
